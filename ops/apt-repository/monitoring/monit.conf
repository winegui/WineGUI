check program winegui_apt_publisher_health
    with path "/usr/local/lib/winegui-apt/bin/winegui-apt-healthcheck"
    every 5 cycles
    if status != 0 then alert

check filesystem winegui_apt_repository with path /var/www/apt.winegui.melroy.org/html
    if space usage > 85% then alert
    if inode usage > 85% then alert

check host winegui_apt_https with address apt.winegui.melroy.org
    if failed
        port 443
        protocol https
        request "/dists/noble/InRelease"
        with timeout 15 seconds
    then alert
