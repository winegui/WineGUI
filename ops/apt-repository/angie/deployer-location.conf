# Include this location in an existing TLS vhost used for deployment webhooks.
# Do not add it to apt.winegui.melroy.org: that host is intentionally static-only.
location = /winegui-apt/gitlab {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:3063/gitlab;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
}
