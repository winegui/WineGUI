default:
  image: registry.melroy.org/melroy/docker-images/gtk-cmake-ninja:trixie

stages:
  - test
  - build
  - deploy

# Linux build template (debs only)
# resource_group serializes the heavy release builds: all jobs in the
# 'heavy-build' group run one at a time instead of thrashing the runner
# in parallel.
.build_template: &build_definition
  stage: build
  resource_group: heavy-build
  rules:
    - if: $CI_PROJECT_NAMESPACE == "melroy" && $CI_COMMIT_TAG
      variables:
        WINEGUI_APT_ENABLED: "ON"
  script:
    - ./scripts/build-prod.sh "DEB"
  artifacts:
    name: "Packages + Documentation"
    expire_in: 1 month
    paths:
      - build_prod/WineGUI-*.deb
      - build_prod/debian-package-*.json

unit_test:
  stage: test
  interruptible: true
  script:
    - ./scripts/run-tests.sh
    - python3 -m unittest discover -s packaging/debian/tests -v

static_code_analysis:
  stage: test
  interruptible: true
  script:
    - cppcheck --version
    - ./scripts/cpp-check.sh

code_style_guidelines:
  stage: test
  interruptible: true
  script:
    - clang-format --version
    - ./scripts/check-format.sh

# Build trixie (deb + rpm + source archive)
build:trixie:
  stage: build
  resource_group: heavy-build
  script:
    - |
      if [[ "$CI_PROJECT_NAMESPACE" == "melroy" && -n "${CI_COMMIT_TAG:-}" ]]; then
        export WINEGUI_APT_ENABLED=ON
      fi
      ./scripts/build-prod.sh "TGZ;DEB;RPM"
    - ./scripts/create-source-archive.sh
  artifacts:
    name: "Packages + Documentation"
    expire_in: 1 month
    paths:
      - doc/doxygen/
      - build_prod/WineGUI-*.deb
      - build_prod/debian-package-*.json
      - build_prod/WineGUI-*.rpm
      - build_prod/WineGUI-*.tar.gz
      - build_prod/WineGUI-Source-*.tar.gz

# Forky (debian)
build:forky:
  image: registry.melroy.org/melroy/docker-images/gtk-cmake-ninja:forky
  <<: *build_definition

# Noble (ubuntu)
build:noble:
  image: registry.melroy.org/melroy/docker-images/gtk-cmake-ninja:noble
  <<: *build_definition

# Plucky (ubuntu)
build:plucky:
  image: registry.melroy.org/melroy/docker-images/gtk-cmake-ninja:plucky
  <<: *build_definition

# Resolute (ubuntu)
build:resolute:
  image: registry.melroy.org/melroy/docker-images/gtk-cmake-ninja:resolute
  <<: *build_definition

# AppImage (single-file, distro-agnostic)
build:appimage:
  stage: build
  resource_group: heavy-build
  rules:
    - if: $CI_PROJECT_NAMESPACE == "melroy" && $CI_COMMIT_TAG
  script:
    - ./scripts/build-appimage.sh
  artifacts:
    name: "AppImage"
    expire_in: 1 month
    paths:
      - build_prod/WineGUI-*.AppImage

# Create release links + release file (containing the version)
release:
  stage: deploy
  image: serversideup/github-cli:latest
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends jq
  needs:
    - job: build:trixie
      artifacts: true
    - job: build:forky
      artifacts: true
    - job: build:noble
      artifacts: true
    - job: build:plucky
      artifacts: true
    - job: build:resolute
      artifacts: true
    - job: build:appimage
      artifacts: true
  rules:
    - if: $CI_PROJECT_NAMESPACE == "melroy" && $CI_COMMIT_TAG
  script:
    # Release to winegui.melroy.org/downloads
    - export APP_VERSION=${CI_COMMIT_TAG}
    - (cd build_prod && sha256sum WineGUI-* > SHA256SUMS)
    - ./scripts/create-release-links.sh
    - ./scripts/create-latest-release-file.sh

    # GitHub sync. Use the GitLab release description as the single source of
    # truth for both newly created and already-existing GitHub releases.
    # GH_TOKEN is provided through the GitLab CI/CD variables.
    - |
      curl --fail --silent --show-error \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --output gitlab-release.json \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}"
      jq --exit-status --raw-output \
        '.description | strings | select(length > 0)' \
        gitlab-release.json > release-notes.md

      if gh release view "$CI_COMMIT_TAG" --repo "winegui/WineGUI" >/dev/null 2>&1; then
        gh release edit "$CI_COMMIT_TAG" \
          --repo "winegui/WineGUI" \
          --title "WineGUI $CI_COMMIT_TAG" \
          --notes-file release-notes.md
        gh release upload "$CI_COMMIT_TAG" \
          build_prod/WineGUI-* \
          build_prod/SHA256SUMS \
          --repo "winegui/WineGUI" \
          --clobber
      else
        gh release create "$CI_COMMIT_TAG" \
          build_prod/WineGUI-* \
          build_prod/SHA256SUMS \
          --repo "winegui/WineGUI" \
          --title "WineGUI $CI_COMMIT_TAG" \
          --notes-file release-notes.md
      fi
  environment:
    name: production
    url: https://winegui.melroy.org/downloads
  artifacts:
    name: "Packages"
    expire_in: 3 months
    paths:
      - release/
      - build_prod/WineGUI-*.deb
      - build_prod/WineGUI-*.rpm
      - build_prod/WineGUI-*.tar.gz
      - build_prod/WineGUI-*.AppImage
      - build_prod/WineGUI-Source-*.tar.gz
      - build_prod/SHA256SUMS

# Assemble the only artifact consumed by the APT batch deployer. This job is a
# deployment so its webhook deployable_id identifies these exact bytes.
apt-repository:
  stage: deploy
  resource_group: winegui-apt-publication
  needs:
    - job: release
      artifacts: false
    - job: build:trixie
      artifacts: true
    - job: build:forky
      artifacts: true
    - job: build:noble
      artifacts: true
    - job: build:plucky
      artifacts: true
    - job: build:resolute
      artifacts: true
  rules:
    - if: $CI_PROJECT_NAMESPACE == "melroy" && $CI_COMMIT_TAG
  script:
    - python3 ./packaging/debian/create-release-batch.py --input build_prod --output apt_repository_batch --tag "$CI_COMMIT_TAG" --commit "$CI_COMMIT_SHA" --rebuild "${WINEGUI_DEB_REBUILD:-1}"
  environment:
    name: winegui-apt-repository
    url: https://apt.winegui.melroy.org
  artifacts:
    name: "WineGUI APT publication batch"
    expire_in: 3 months
    paths:
      - apt_repository_batch/
